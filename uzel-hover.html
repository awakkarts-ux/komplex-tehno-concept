<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Главная: схема узла с плашками — учёттепла.рф</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sofia+Sans+Extra+Condensed:wght@700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#E8EAEC;--card:#F5F5F7;--text:#3A3D42;--text-2:#6A6A6A;--stroke:#C4C4C4;--hair:#DADCDF;--acc:#C2410C;
 --H:'Sofia Sans Extra Condensed','Arial Narrow',sans-serif;--B:Inter,Arial,sans-serif}
*{box-sizing:border-box}html{font-size:calc(100vw/120)}@media(max-width:1200px){html{font-size:10px}}
body{margin:0;background:var(--bg);color:var(--text);font:400 max(1rem,15px)/1.5 var(--B);letter-spacing:-.015em;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ol,ul,figure{margin:0}ol,ul{padding:0;list-style:none}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{padding:.5rem;display:grid;gap:.5rem}
.card{background:#fff;border-radius:.75rem;padding:2.5rem}
.grid{display:grid;grid-template-columns:37rem minmax(0,1fr);column-gap:1.5rem}
.lbl{font:600 max(.8125rem,13px)/1.5 var(--B);letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.h1{font:800 4rem/1 var(--H);text-transform:uppercase;letter-spacing:-.03em}.h1 b{color:var(--acc)}
.h4{font:800 2.5rem/1 var(--H);text-transform:uppercase;letter-spacing:-.03em;text-wrap:balance}
.h5{font:800 2rem/1 var(--H);text-transform:uppercase;letter-spacing:-.03em}
.h4 b,.h5 b{color:var(--acc)}
.p{max-width:62ch}.p+.p{margin-top:.75rem}.mut{color:var(--text-2)}
.s{font-size:max(.875rem,13px);line-height:1.45}
svg{display:block;width:100%;height:auto}
svg .mk{cursor:pointer}svg .mk-h{fill:var(--acc);opacity:0;transition:opacity .2s}
svg .mk-c,svg .mk text{transition:fill .2s,stroke .2s}
svg .mk.on .mk-h{opacity:.15}svg .mk.on .mk-c{fill:var(--acc);stroke:var(--acc)}svg .mk.on text{fill:#fff}

/* служебное: разделы страницы согласования */
.intro{background:#fff;border-radius:.75rem;padding:2.5rem}
.intro .h1{margin-bottom:1.25rem}
.diag{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem;margin-top:2rem}
.diag li{background:var(--card);border-radius:.5rem;padding:1.25rem}
.diag b{display:block;font:800 1.5rem/1 var(--H);text-transform:uppercase;margin-bottom:.5rem}
.diag b i{font-style:normal;color:var(--acc)}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem 1.5rem;margin-top:1.5rem;counter-reset:r}
.rules li{counter-increment:r;padding-top:.75rem;border-top:1px solid var(--stroke)}
.rules li::before{content:counter(r,decimal-leading-zero);display:inline-grid;place-items:center;width:1.75rem;height:1.75rem;border:1px solid var(--acc);color:var(--acc);border-radius:.25rem;font:700 max(.75rem,12px) var(--B);margin-right:.75rem}
.vh{display:flex;align-items:baseline;gap:1.5rem;padding:3rem 2.5rem 1rem}
.vh .tag{font:800 4rem/1 var(--H);color:var(--acc)}
.vh .h4{margin-bottom:.5rem}
.vh .pro{display:flex;gap:2rem;margin-top:.5rem}.vh .pro span::before{content:'+ ';color:var(--acc);font-weight:700}.vh .pro span.m::before{content:'− ';color:var(--text-2)}
.stub{background:#fff;border-radius:.75rem;padding:2.5rem;display:grid;grid-template-columns:37rem 1fr;column-gap:1.5rem;opacity:.55}
.stub i{display:block;height:.75rem;border-radius:.375rem;background:#E3E5E8;margin:.6rem 0}
.stub .t{height:2.5rem;width:70%;background:#D9DCE0}
.rec{background:var(--acc);color:#fff;border-radius:.75rem;padding:2.5rem}
.rec .h4{color:#fff;margin-bottom:1rem}.rec .p{max-width:90ch}

/* ── общий «стол» под схему ── */
.stage{background:var(--card);border-radius:.5rem;position:relative;overflow:hidden}

/* ── A. Секция в сетке ── */
.a-head{align-items:start}
.a-stage{margin-top:2.5rem;padding:3.5rem 4rem 3rem 0}
.leg{display:grid;grid-template-columns:repeat(9,1fr);gap:1rem;margin-top:1.5rem}
.leg li{display:flex;gap:.625rem;align-items:center;padding-top:1rem;border-top:1px solid var(--stroke);font-size:max(.875rem,13px);line-height:1.25;cursor:default;transition:border-color .2s,color .2s}
.num{flex:none;display:inline-grid;place-items:center;width:1.75rem;height:1.75rem;border:1px solid var(--stroke);border-radius:.25rem;font:700 max(.75rem,12px) var(--B);background:#fff;transition:all .2s}
.leg li.on{border-color:var(--acc);color:var(--acc)}.leg li.on .num{background:var(--acc);border-color:var(--acc);color:#fff}

/* ── B. Чертёжный лист ── */
.sheet{margin-top:2.5rem;border:1px solid var(--stroke);border-radius:.5rem;background:#fff;
 background-image:linear-gradient(#EEF0F2 1px,transparent 1px),linear-gradient(90deg,#EEF0F2 1px,transparent 1px);background-size:1.5rem 1.5rem;background-position:-1px -1px;
 display:grid;grid-template-columns:minmax(0,1fr) 22rem}
.sheet .draw{padding:3rem 2rem 2.5rem 2.5rem;border-right:1px solid var(--stroke)}
.spec{display:flex;flex-direction:column;background:#fff;border-radius:0 .5rem .5rem 0}
.spec table{border-collapse:collapse;width:100%;font-size:max(.8125rem,13px)}
.spec th{font:600 max(.75rem,12px)/1 var(--B);letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);text-align:left;padding:1rem 1rem .75rem;border-bottom:1px solid var(--stroke)}
.spec td{padding:.625rem 1rem;border-bottom:1px solid var(--hair);transition:background .2s,color .2s;cursor:default}
.spec td:first-child{width:3.5rem;font-weight:700;color:var(--text-2);border-right:1px solid var(--hair)}
.spec tr.on td{background:#FCEFE8;color:var(--acc)}
.stamp{margin-top:auto;border-top:1px solid var(--stroke);display:grid;grid-template-columns:1fr auto;font-size:max(.75rem,12px)}
.stamp div{padding:.75rem 1rem;border-bottom:1px solid var(--hair)}.stamp div:nth-child(odd){border-right:1px solid var(--hair)}
.stamp div:nth-last-child(-n+2){border-bottom:0}
.stamp .big{grid-column:1/-1;border-right:0!important;font:800 1.5rem/1 var(--H);text-transform:uppercase;padding:1rem}
.stamp .big b{color:var(--acc)}

/* ── C. Разбор по элементам ── */
.c-stage{margin-top:2.5rem;padding:3.5rem 4rem 3rem 0}
.c-bar{display:grid;grid-template-columns:37rem minmax(0,1fr);column-gap:1.5rem;margin-top:1.5rem;align-items:start}
.c-info{min-height:9rem}
.c-info .h5{margin:.5rem 0 .75rem}.c-info .h5 span{color:var(--acc)}
.c-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.c-tabs button{display:flex;align-items:center;gap:.75rem;padding:.75rem;border:1px solid var(--stroke);border-radius:.5rem;background:#fff;text-align:left;font-size:max(.875rem,13px);font-weight:600;transition:all .2s}
.c-tabs button:hover{border-color:var(--text)}
.c-tabs button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.c-tabs button[aria-pressed=true] .num{background:#fff;color:var(--acc);border-color:#fff}
.draft{display:inline-block;margin-left:.5rem;font:600 11px/1 var(--B);letter-spacing:.04em;text-transform:uppercase;color:var(--acc);border:1px dashed var(--acc);border-radius:.25rem;padding:.25rem .375rem;vertical-align:middle}

/* ── Ремонт R1: переключатель ── */
.seg{display:inline-flex;border:1px solid var(--stroke);border-radius:.5rem;overflow:hidden}
.seg button{padding:.875rem 1.5rem;font-weight:600;font-size:max(.875rem,13px);background:#fff;transition:background .2s,color .2s}
.seg button+button{border-left:1px solid var(--stroke)}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.r1-top{display:flex;justify-content:space-between;align-items:end;gap:2rem}
.r1-stage{margin-top:2rem;padding:3rem 0 2.5rem;display:grid}
.r1-stage>div{grid-area:1/1;transition:opacity .35s}.r1-stage>div.off{opacity:0;pointer-events:none}
.r1-notes{display:grid;margin-top:1.5rem}.r1-notes>ol{grid-area:1/1;display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;transition:opacity .35s}.r1-notes>ol.off{opacity:0}
.r1-notes li{display:flex;gap:.625rem;align-items:center;padding-top:1rem;border-top:1px solid var(--stroke);font-size:max(.875rem,13px);line-height:1.3}
.r1-notes .bad .num{border-color:var(--text-2);color:var(--text-2)}
.r1-notes .good .num{border-color:var(--acc);color:var(--acc)}
.x{display:inline-grid;place-items:center;width:1.75rem;height:1.75rem;flex:none;color:var(--text-2);font-weight:700}

/* ── Ремонт R2: две строки в сетке ── */
.r2-row{margin-top:2.5rem;align-items:center}
.r2-row+.r2-row{margin-top:.5rem}
.r2-side .h5{margin-bottom:.75rem}
.r2-side ol{margin-top:1.25rem;display:grid;gap:.5rem}
.r2-side li{display:flex;gap:.625rem;align-items:center;font-size:max(.875rem,13px);line-height:1.3}
.r2-side .num{border-color:var(--acc);color:var(--acc)}
.r2-stage{padding:2rem 0}
.r2-row.before .r2-stage{background:#F0F1F3}
.r2-row.before svg{filter:saturate(.35);opacity:.9}

/* ── Встроенная в текст ── */
.inl{grid-template-columns:37rem minmax(0,1fr)}
.toc{background:var(--card);border-radius:.5rem;padding:1.5rem;align-self:start}
.toc i{display:block;height:.6rem;border-radius:.3rem;background:#E0E2E5;margin:.7rem 0}
.fig{margin:2rem 0}
.fig .stage{padding:2.5rem 0 2rem}
.fig figcaption{display:grid;grid-template-columns:auto 1fr;gap:1rem;margin-top:1rem;font-size:max(.875rem,13px);color:var(--text-2);line-height:1.45}
.fig figcaption b{color:var(--text);font-weight:600;white-space:nowrap}

.stage{position:relative;background:var(--card);border-radius:.5rem;overflow:hidden}
.hit{fill:transparent;stroke:transparent;cursor:pointer;transition:fill .15s,stroke .15s}
path.hit{fill:none}
.hit:hover,.hit.on{fill:rgba(194,65,12,.08);stroke:#C2410C;stroke-width:1.5}
path.hit:hover,path.hit.on{fill:none;stroke:rgba(194,65,12,.55);stroke-width:22}
.dot-c{fill:#C2410C;stroke:#fff;stroke-width:1.5}
.dot-r{fill:none;stroke:#C2410C;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.dot{transition:opacity .2s}.dot.off{opacity:0}
.hintpill{position:absolute;left:50%;transform:translateX(-50%);bottom:1.25rem;z-index:2;display:flex;align-items:center;gap:.625rem;background:#fff;border-radius:2rem;padding:.625rem 1rem .625rem .75rem;font:600 max(.875rem,13px)/1.2 var(--B);box-shadow:0 2px 12px rgba(0,0,0,.08);transition:opacity .3s}
.hintpill i{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--acc);display:grid;place-items:center;flex:none}
@media (prefers-reduced-motion:reduce){.dot-r{animation:none}}
.tip{position:absolute;z-index:3;width:24rem;background:#fff;border-radius:.5rem;padding:1rem 1.25rem;box-shadow:0 8px 32px rgba(0,0,0,.14);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font:800 1.5rem/1 var(--H);text-transform:uppercase;letter-spacing:-.02em;margin-bottom:.5rem}
.tip p{font-size:max(.875rem,13px);line-height:1.45;color:var(--text-2)}
