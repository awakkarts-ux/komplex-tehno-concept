<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Главная: схема узла на телефоне — учёттепла.рф</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sofia+Sans+Extra+Condensed:wght@700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#E8EAEC;--card:#F5F5F7;--text:#3A3D42;--text-2:#6A6A6A;--stroke:#C4C4C4;--hair:#DADCDF;--acc:#C2410C;
 --H:'Sofia Sans Extra Condensed','Arial Narrow',sans-serif;--B:Inter,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 var(--B);letter-spacing:-.015em;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol{margin:0}ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
.defs{position:absolute;width:0;height:0;overflow:hidden}
/* общие точки */
.dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--acc);border:2px solid #fff;pointer-events:none;transition:opacity .2s}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--acc);animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.dot::after{animation:none}}
.dot.off{opacity:0}
.tl{position:absolute;left:4px;transform:translateY(-50%);font:700 12px/1 var(--B);padding:4px 6px;border-radius:4px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);pointer-events:none}
.tl.t1{color:var(--acc)}.tl.t2{color:var(--text)}
.hint{display:flex;align-items:center;gap:10px;font:600 13px/1.3 var(--B);color:var(--text)}
.hint i{width:24px;height:24px;border-radius:50%;background:var(--acc);display:grid;place-items:center;flex:none}
/* макет мобильной страницы */
.proto{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;height:44px;padding:0 8px 0 16px;background:#3A3D42;color:#fff;font:600 12px/1 var(--B)}
.proto span{flex:1;opacity:.8}.proto a{color:#fff;text-decoration:none;min-width:36px;height:32px;display:grid;place-items:center;border-radius:6px;background:rgba(255,255,255,.12)}
.proto a.on{background:var(--acc)}
.mh{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px;background:#fff;font:800 22px/1 var(--H);text-transform:uppercase;letter-spacing:-.02em}
.mh b{color:var(--acc)}.mh i{width:24px;height:14px;border-top:2px solid var(--text);border-bottom:2px solid var(--text);position:relative}.mh i::after{content:"";position:absolute;left:0;right:0;top:4px;border-top:2px solid var(--text)}
.stub{margin:8px;border-radius:12px;background:#fff;padding:24px 16px;color:var(--text-2);font:600 12px/1.4 var(--B);letter-spacing:.06em;text-transform:uppercase}
.stub .ln{height:14px;border-radius:4px;background:var(--card);margin-top:12px}
.stub .big{height:180px;border-radius:8px;background:var(--card);margin-top:16px}
.blk{margin:8px;border-radius:12px;background:#fff;padding:24px 0 20px;overflow:hidden}
.blk .lbl{padding:0 16px 16px;font:600 12px/1.4 var(--B);letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
/* шторка */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -8px 32px rgba(0,0,0,.16);
 padding:8px 16px calc(12px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);touch-action:none}
.sheet.on{transform:none}
.handle{display:block;width:40px;height:4px;border-radius:2px;background:var(--hair);margin:0 auto 8px}
.sh-top{display:flex;align-items:flex-start;gap:8px}
.sh-top b{flex:1;font:800 28px/1 var(--H);text-transform:uppercase;letter-spacing:-.02em;padding-top:10px}
.x{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none;margin-right:-8px}
.x::before,.x::after{content:"";position:absolute;width:16px;height:2px;background:var(--text);border-radius:1px;transform:rotate(45deg)}.x::after{transform:rotate(-45deg)}
.x{position:relative}
.sheet p.d{margin-top:8px;font-size:15px;line-height:1.45;color:var(--text-2);min-height:66px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font:600 13px/1 var(--B);color:var(--text-2)}
.nav button{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.nav button svg{width:16px;height:16px}
.nav .cnt b{color:var(--text)}
/* A — панорама */
.pano{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;touch-action:manipulation;scrollbar-width:none;background:var(--card)}
.pano::-webkit-scrollbar{display:none}
.pano-in{position:relative}
.pano-in>svg{display:block}
.snap{position:absolute;top:0;width:1px;height:1px;scroll-snap-align:center}
.hit{position:absolute;border-radius:10px;border:1.5px solid transparent;transition:background .15s,border-color .15s}
.hit.on{background:rgba(194,65,12,.08);border-color:var(--acc)}
.hit .dot{left:50%;top:50%}
.hit.on .dot{opacity:0}
.foot{display:flex;align-items:center;gap:12px;padding:12px 16px 0}
.mm{position:relative;flex:none;width:132px;height:62px;border-radius:6px;background:var(--card);overflow:hidden}
.mm svg{display:block;width:100%;height:100%;opacity:.7}
.mm .vp{position:absolute;top:1px;bottom:1px;border:1.5px solid var(--acc);border-radius:4px;background:rgba(194,65,12,.06);pointer-events:none}
/* B — превью + шторка с увеличением */
.thumb{position:relative;margin:0 16px;background:var(--card);border-radius:8px;cursor:pointer;touch-action:manipulation}
.thumb>svg{display:block;width:100%;height:auto}
.thumb .press{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(194,65,12,.18);pointer-events:none;opacity:0;transition:opacity .2s}
.thumb .press.on{opacity:1}
.zoombtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 16px 0;height:48px;border-radius:8px;background:var(--text);color:#fff;font:600 14px/1 var(--B);width:calc(100% - 32px)}
.modal{position:fixed;inset:0;z-index:30;pointer-events:none}
.modal .bd{position:absolute;inset:0;background:rgba(30,32,36,.45);opacity:0;transition:opacity .25s}
.modal.on{pointer-events:auto}.modal.on .bd{opacity:1}
.modal .sheet{padding-left:0;padding-right:0}
.modal .sh-top,.modal p.d,.modal .nav{padding:0 16px}
.modal .x{margin-right:8px}
.modal .mini{margin:0 16px 8px}
/* общий кроп и карусель (B, C) */
.car{position:relative;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;padding:0 16px;scroll-padding:0 16px;touch-action:manipulation}
.car::-webkit-scrollbar{display:none}
.crop{position:relative;height:200px;background:var(--card);border-radius:8px;overflow:hidden}
.crop svg{display:block;width:100%;height:100%}
.crop .ring{fill:rgba(194,65,12,.06);stroke:var(--acc);stroke-width:1.5;vector-effect:non-scaling-stroke}
.crop .lnk{fill:none;stroke:var(--acc);stroke-width:2.5;opacity:.55;vector-effect:non-scaling-stroke}
.slide{flex:none;width:100%;scroll-snap-align:start}
.modal .car{padding:0;scroll-padding:0;margin:0 16px}
.mini{position:relative;background:var(--card);border-radius:8px;overflow:hidden;cursor:pointer;touch-action:manipulation}
.mini>svg{display:block;width:100%;height:auto;opacity:.75}
.mini .fr{position:absolute;border:1.5px solid var(--acc);border-radius:4px;background:rgba(194,65,12,.06);pointer-events:none;transition:all .25s}
.mini .dot{width:10px;height:10px;margin:-5px 0 0 -5px;border-width:1.5px}.mini .dot::after,.thumb .dot::after{inset:-2px}
/* C — мини-карта + карточки */
.v-c .mini{margin:0 16px 12px}
.cd{flex:none;width:calc(100% - 24px);max-width:358px;scroll-snap-align:start;background:var(--card);border-radius:8px;overflow:hidden}
.cd .crop{border-radius:0;background:transparent}
.cd .cap{padding:4px 16px 16px}
.cd .n{font:600 12px/1 var(--B);letter-spacing:.06em;color:var(--text-2)}
.cd b{display:block;margin-top:8px;font:800 26px/1 var(--H);text-transform:uppercase;letter-spacing:-.02em}
.cd p{margin-top:8px;font-size:14px;line-height:1.45;color:var(--text-2)}
.pg{display:flex;justify-content:center;gap:0;margin-top:8px}
.pg button{width:28px;height:44px;display:grid;place-items:center}
.pg button::before{content:"";width:6px;height:6px;border-radius:3px;background:var(--hair);transition:all .2s}
.pg button.on::before{width:18px;background:var(--acc)}
.v-c .hint{padding:4px 16px 0}
/* сравнение */
.cmp{padding:40px 32px 64px;max-width:1400px;margin:0 auto}
.cmp h1{font:800 48px/1 var(--H);text-transform:uppercase;letter-spacing:-.03em}.cmp h1 b{color:var(--acc)}
.cmp .lead{margin-top:16px;max-width:820px;color:var(--text-2)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px}
.col h2{font:800 30px/1 var(--H);text-transform:uppercase;letter-spacing:-.02em;margin-bottom:6px}
.col h2 span{color:var(--acc)}
.col .sub{font-size:14px;color:var(--text-2);min-height:63px}
.phone{width:414px;max-width:100%;margin:16px 0;padding:12px;border-radius:52px;background:#1d1f22;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.phone iframe{display:block;width:390px;height:844px;border:0;border-radius:40px;background:#fff}
.tag{display:inline-block;margin-left:8px;vertical-align:middle;font:700 11px/1 var(--B);letter-spacing:.06em;text-transform:uppercase;background:var(--acc);color:#fff;border-radius:4px;padding:5px 7px}
.pc{font-size:14px;line-height:1.45}.pc li{padding-left:18px;position:relative;margin-top:6px}
.pc li::before{position:absolute;left:0;font-weight:700}.pc .p::before{content:"+";color:#1a7f37}.pc .m::before{content:"−";color:var(--acc)}
.open{display:inline-flex;margin-top:12px;font:600 14px/1 var(--B);color:var(--acc)}
.rules{margin-top:56px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.rules section{background:#fff;border-radius:12px;padding:28px}
.rules h3{font:800 26px/1 var(--H);text-transform:uppercase;letter-spacing:-.02em;margin-bottom:12px}
.rules li{margin-top:8px;font-size:14px;line-height:1.5;padding-left:18px;position:relative}.rules li::before{content:"—";position:absolute;left:0;color:var(--acc)}
.links{display:none}
@media (max-width:900px){.cols{grid-template-columns:1fr}.rules{grid-template-columns:1fr}.phone{display:none}.links{display:block}.cmp{padding:24px 16px}}

d\">Главная, 2-й блок. Десктоп — <a href=\"./uzel-hover.html\">uzel-hover.html<\/a> (плашка при наведении). На телефоне наведения нет, а схема 1320×616 в 360–430 px шириной сжимается в 3,7 раза — подписи по 3 px. Ниже три способа. В рамках — живые прототипы 390×844: листайте, нажимайте.<\/p><div class=\"cols\"><div class=\"col\"><h2><span>A<\/span> · Панорама<\/h2><p class=\"sub\">Схема в натуральную величину, листается вбок с остановками на приборах. Тап — шторка снизу.<\/p><div class=\"phone\"><iframe src=\"./uzel-mobile.html?v=a\" title=\"Вариант A\" loading=\"lazy\"><\/iframe><\/div><ul class=\"pc\"><li class=\"p\">Ближе всего к десктопу: та же схема и те же точки<\/li><li class=\"p\">Шторка не закрывает прибор: схема подъезжает к нему<\/li><li class=\"m\">Целиком схему не видно: только мини-карта 132 px<\/li><li class=\"m\">Горизонтальный скролл внутри страницы — второй жест; часть людей не догадается листать<\/li><li class=\"m\">Надпись «РАСХОДОМЕР» на приборе в этом масштабе не читается — убрана, название даёт шторка<\/li><\/ul><a class=\"open\" href=\"./uzel-mobile.html?v=a\">Открыть на весь экран →<\/a><\/div><div class=\"col\"><h2><span>B<\/span> · Увеличение в шторке<\/h2><p class=\"sub\">На странице — вся схема по ширине экрана как превью. Тап по прибору — шторка с увеличенным фрагментом, описанием и ‹ ›.<\/p><div class=\"phone\"><iframe src=\"./uzel-mobile.html?v=b\" title=\"Вариант B\" loading=\"lazy\"><\/iframe><\/div><ul class=\"pc\"><li class=\"p\">Схема видна целиком, страница не листается вбок<\/li><li class=\"p\">В шторке крупный план: подписи ≥ 12 px, мини-карта показывает, где мы<\/li><li class=\"m\">Превью мелкое (≈ 170 px высотой): приборы угадываются, но не читаются<\/li><li class=\"m\">Модальное окно — лишний шаг; описания не видны без тапа<\/li><\/ul><a class=\"open\" href=\"./uzel-mobile.html?v=b\">Открыть на весь экран →<\/a><\/div><div class=\"col\"><h2><span>C<\/span> · Карточки + мини-карта<i class=tag>Рекомендую<\/i><\/h2><p class=\"sub\">Сверху — схема целиком как мини-карта с рамкой. Под ней карточки «прибор за прибором»: крупный план, название, описание.<\/p><div class=\"phone\"><iframe src=\"./uzel-mobile.html?v=c\" title=\"Вариант C\" loading=\"lazy\"><\/iframe><\/div><ul class=\"pc\"><li class=\"p\">Описания видны сразу, без тапа и без всплывающих окон<\/li><li class=\"p\">Знакомый жест — карусель; вертикальный скролл не перехватывается<\/li><li class=\"p\">Схема целиком всегда на экране, рамка показывает, где прибор<\/li><li class=\"m\">Блок выше остальных: ≈ 690 px (A ≈ 615, B ≈ 280)<\/li><\/ul><a class=\"open\" href=\"./uzel-mobile.html?v=c\">Открыть на весь экран →<\/a><\/div><\/div><div class=\"rules\"><section><h3>Тач: общие правила<\/h3><ul><li>Тап вместо наведения. Плашка закрывается крестиком, вторым тапом по тому же прибору, тапом вне шторки или свайпом шторки вниз.<\/li><li>Зоны касания ≥ 44×44 px (в A — кнопки поверх приборов; в B и C тап по схеме выбирает ближайший прибор, поэтому промахнуться нельзя).<\/li><li>Подсказка «Нажмите на прибор…» вместо «Наведите…». Пульсирующие точки остаются; у выбранного прибора точка гаснет.<\/li><li>Вертикальный скролл страницы не перехватывается: горизонтальные области — обычный нативный скролл с привязкой (scroll-snap), без своих обработчиков касаний; overscroll-behavior-x: contain — свайп не уводит «назад» в браузере.<\/li><li>«Линии связи» на телефоне получили свою точку на пунктире (на десктопе их находили наведением).<\/li><li>Подписи на схеме ≥ 12 px на экране; бренда на приборах нет — «РАСХОДОМЕР», «ВЫЧИСЛИТЕЛЬ».<\/li><\/ul><\/section><section><h3>Вопросы к дизайнеру<\/h3><ul><li>Вариант: беру C? Тогда в Figma — мини-карта + компонент карточки (9 вариантов).<\/li><li>Нужен ли на телефоне заголовок блока? На десктопе его убрали, но без него карусель «Запорная арматура…» стоит без контекста.<\/li><li>Порядок карточек — по категориям (как на десктопе: 01 Кран … 09 Линии связи) или по ходу воды по Т1?<\/li><li>Планшет 768–1024: оставить десктопную схему с тапом (плашка над прибором) — она там читается.<\/li><li>Тексты плашек всё ещё мои — нужно согласование с клиентом.<\/li><\/ul><\/section><\/div><div class=\"links\"><p style=\"margin-top:24px\"><a class=\"open\" href=\"?v=a\">A · Панорама →<\/a><\/p><p><a class=\"open\" href=\"?v=b\">B · Увеличение в шторке →<\/a><\/p><p><a class=\"open\" href=\"?v=c\">C · Карточки + мини-карта →<\/a><\/p><\/div><\/main>";const _v=new URLSearchParams(location.search).get('v');document.getElementById('root').innerHTML=_v&&TPL[_v]?TPL[_v]:CMP;if(_v)document.body.classList.add('m');</script><script>
